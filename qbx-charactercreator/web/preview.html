<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview · Création de personnage</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="preview.css" />
</head>
<body class="preview-body">
    <div class="studio">
        <div class="studio-floor"></div>
        <div class="studio-glow"></div>
        <div class="character" id="preview-character" aria-hidden="true">
            <div class="character-light"></div>
            <svg viewBox="0 0 220 520" class="character-svg">
                <defs>
                    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#c9a07a"/>
                        <stop offset="100%" stop-color="#9b704d"/>
                    </linearGradient>
                    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#2a2d33"/>
                        <stop offset="100%" stop-color="#15171b"/>
                    </linearGradient>
                </defs>
                <ellipse cx="110" cy="498" rx="62" ry="10" fill="rgba(0,0,0,.45)"/>
                <path d="M78 250c-18 8-28 38-22 92l8 118h28l6-96 12 96h28l8-118c6-54-4-84-22-92z" fill="#1b1f27"/>
                <path d="M70 168c-22 10-34 38-20 86 8 28 26 40 48 42h24c22-2 40-14 48-42 14-48 2-76-20-86-18 22-62 22-80 0z" fill="url(#cloth)"/>
                <path d="M54 176c-16 18-10 70 8 86l18-8c-8-18-12-48 0-70z" fill="url(#cloth)"/>
                <path d="M166 176c16 18 10 70-8 86l-18-8c8-18 12-48 0-70z" fill="url(#cloth)"/>
                <circle cx="110" cy="92" r="46" fill="url(#skin)"/>
                <path d="M68 88c8-38 76-38 84 4-18-22-66-22-84-4z" fill="#1a1410"/>
                <path d="M86 86c6 2 10 8 10 14M134 86c-6 2-10 8-10 14" stroke="#2b2118" stroke-width="3" fill="none"/>
                <path d="M96 108c8 8 20 8 28 0" stroke="#6a4530" stroke-width="2" fill="none"/>
            </svg>
        </div>
    </div>

    <div id="app" class="hidden" aria-hidden="true">
        <div class="grain"></div>
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark"></span>
                <div>
                    <p class="eyebrow">Studio identité</p>
                    <h1 id="ui-title">Création de personnage</h1>
                </div>
            </div>
            <div class="progress-wrap">
                <div class="progress-meta">
                    <span id="step-label">Étape 1 sur 9</span>
                    <span id="category-label">Identité</span>
                </div>
                <div class="progress-track">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>
        </header>

        <aside class="sidebar">
            <nav id="category-list" class="category-list"></nav>
        </aside>

        <main class="panel">
            <section class="panel-head">
                <p class="eyebrow" id="panel-eyebrow">Catégorie</p>
                <h2 id="panel-title">Identité</h2>
                <p class="panel-hint" id="panel-hint">Renseignez l’identité officielle de votre personnage.</p>
            </section>
            <div id="fields" class="fields"></div>
        </main>

        <section class="stage" id="stage">
            <div class="rotate-tools">
                <button type="button" class="icon-btn" data-rotate="-8" id="btn-rot-left" title="Rotation gauche">‹</button>
                <button type="button" class="icon-btn" data-rotate="reset" id="btn-rot-reset" title="Réinitialiser la rotation">◎</button>
                <button type="button" class="icon-btn" data-rotate="8" id="btn-rot-right" title="Rotation droite">›</button>
            </div>
            <p class="stage-hint">Glissez pour faire tourner le personnage</p>
        </section>

        <footer class="actions">
            <div class="actions-left">
                <button type="button" class="btn ghost" id="btn-reset">Réinitialiser</button>
                <button type="button" class="btn ghost" id="btn-cancel">Annuler</button>
            </div>
            <div class="actions-right">
                <button type="button" class="btn" id="btn-prev">Retour</button>
                <button type="button" class="btn primary" id="btn-next">Continuer</button>
            </div>
        </footer>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-card">
            <h3 id="modal-title">Confirmer</h3>
            <p id="modal-text"></p>
            <div class="modal-actions">
                <button type="button" class="btn" id="modal-no">Retour</button>
                <button type="button" class="btn primary" id="modal-yes">Confirmer</button>
            </div>
        </div>
    </div>

    <div id="toasts" class="toasts"></div>
    <p class="preview-badge">PREVIEW NAVIGATEUR · hors FiveM</p>

    <script>window.CREATOR_PREVIEW = true;</script>
    <script src="components/icons.js"></script>
    <script src="components/controls.js"></script>
    <script src="app.js"></script>
    <script src="preview.js"></script>
</body>
</html>
